# description of what the software does, shorter than 250 characters, sentence case
description: "Flow collector, enricher and visualizer."
# list of license identifiers, see https://github.com/awesome-foss/awesome-sysadmin-data/blob/master/licenses.yml for the full list of licenses
licenses:
